spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}

# MUST match identity-service. Dev default only; the real value comes from .env / environment.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-at-least-32-chars}

management.endpoints.web.exposure.include=health

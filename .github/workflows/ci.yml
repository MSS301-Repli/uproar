# Continuous Integration: every PR and every push to dev must stay green.
#   backend  - build + unit tests of every Maven service (new services are picked up automatically)
#   mobile   - format, analyze, test, build release APK
#   e2e      - start the whole system with Docker Compose and run scripts/smoke-test.sh through the gateway
name: CI

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  services:
    name: Detect services
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.find.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      # Every top-level folder with a pom.xml is a service, e.g. ["api-gateway","identity-service"]
      - id: find
        run: echo "list=$(ls -d */pom.xml | xargs -n1 dirname | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (${{ matrix.service }})
    needs: services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.services.outputs.list) }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  e2e:
    name: End-to-end (Docker Compose)
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '*/pom.xml'
      - name: Package services
        run: for d in */pom.xml; do (cd "$(dirname "$d")" && mvn -B -ntp -q package -DskipTests); done
      - name: Create .env for CI
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .env
      - name: Start system
        run: docker compose up -d --build
      - name: Smoke test through the gateway
        run: bash scripts/smoke-test.sh
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Stop system
        if: always()
        run: docker compose down -v

  # Single required check for branch protection: matrix job names change whenever a service is added
  ci-passed:
    name: CI passed
    if: always()
    needs: [backend, mobile, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        run: |
          echo "backend=${{ needs.backend.result }} mobile=${{ needs.mobile.result }} e2e=${{ needs.e2e.result }}"
          test "${{ needs.backend.result }}" = success
          test "${{ needs.mobile.result }}" = success
          test "${{ needs.e2e.result }}" = success

spring.application.name=identity-service
server.port=8081

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/identity_db
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:root}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# MUST match api-gateway. Dev default only; the real value comes from .env / environment.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-at-least-32-chars}
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7

# Seeded on startup if missing (see AdminSeeder)
app.admin.email=${ADMIN_EMAIL:admin@socialapp.local}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

management.endpoints.web.exposure.include=health
